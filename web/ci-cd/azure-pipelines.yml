# =============================================================================
# StudioOS Web — CI + CD
#
# • Stage Test (always): lint, format, build (tsc + vite)
# • Stage Deploy (only on push to main): tar client/ → scp → ssh rebuild on st
# =============================================================================

trigger:
  branches:
    include:
      - main
      - development

pr:
  branches:
    include:
      - main
      - development

stages:
  # =============================================================================
  # CI — runs on every PR and on pushes to non-main branches.
  # Skipped on direct pushes to main: tests already ran when the PR was opened,
  # and admin direct-merges to main bypass them intentionally during iteration.
  # =============================================================================
  - stage: Test
    condition: ne(variables['Build.SourceBranch'], 'refs/heads/main')
    displayName: "Test"
    jobs:
      - job: Build
        displayName: "Build & validate"
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: "20.x"
            displayName: "Install Node.js"

          - script: npm ci
            workingDirectory: client
            displayName: "Install dependencies"

          - script: npx eslint . --format json -o eslint-results.json || true
            workingDirectory: client
            displayName: "Lint (ESLint) - outputs to PR comments"
            continueOnError: true

          - script: node ci-cd/eslint-to-pr-comments.mjs
            displayName: "Post ESLint results as PR comments"
            condition: and(succeededOrFailed(), eq(variables['Build.Reason'], 'PullRequest'))
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

          - script: npm run format:check
            workingDirectory: client
            displayName: "Format check (Prettier)"

          - script: npm run build
            workingDirectory: client
            displayName: "Build (TypeScript + Vite)"

  # =============================================================================
  # CD — deploys to st only on push to main
  # =============================================================================
  - stage: Deploy
    displayName: "Deploy to st"
    dependsOn: Test
    # Run on main even when Test was skipped (it always is on main pushes — see
    # the Test stage condition above). `succeeded()` does NOT treat Skipped as
    # success, so we check the result enum explicitly.
    condition: and(in(dependencies.Test.result, 'Succeeded', 'Skipped'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: DeployToST
        displayName: "Build & up web on VPS"
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            displayName: "Checkout source"

          - bash: |
              set -euxo pipefail
              cd $(Build.SourcesDirectory)
              mkdir -p $(Build.ArtifactStagingDirectory)
              tar --no-xattrs -czf $(Build.ArtifactStagingDirectory)/studioos-web.tar.gz \
                --exclude='client/node_modules' \
                --exclude='client/dist' \
                --exclude='client/.env*' \
                --exclude='client/eslint-results.json' \
                --exclude='**/.DS_Store' \
                client
              ls -lh $(Build.ArtifactStagingDirectory)/studioos-web.tar.gz
            displayName: "Package web client"

          - task: CopyFilesOverSSH@0
            displayName: "SCP tarball to VPS"
            inputs:
              sshEndpoint: 'st-studioos-ssh'
              sourceFolder: '$(Build.ArtifactStagingDirectory)'
              contents: 'studioos-web.tar.gz'
              targetFolder: '/tmp/'
              overwrite: true

          - task: SSH@0
            displayName: "Extract, rebuild web, up"
            inputs:
              sshEndpoint: 'st-studioos-ssh'
              runOptions: inline
              failOnStdErr: false
              inline: |
                set -e
                cd /srv/studioos

                # Replace client/ in place; api/, server/, .env, volumes stay
                rm -rf client
                tar xzf /tmp/studioos-web.tar.gz
                rm /tmp/studioos-web.tar.gz

                # Rebuild & up only the web service
                docker compose -f docker-compose.yml -f docker-compose.st.yml build web
                docker compose -f docker-compose.yml -f docker-compose.st.yml up -d web

                sleep 5
                docker compose -f docker-compose.yml -f docker-compose.st.yml ps web

                # Smoke test
                curl -fsS -o /dev/null https://st.studioos.club/ && echo "✓ Web responding"
