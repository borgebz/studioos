trigger:
  branches:
    include:
      - main
      - development

pr:
  branches:
    include:
      - main
      - development

pool:
  vmImage: "ubuntu-latest"

jobs:
  - job: Build
    displayName: "Build and validate"
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: "20.x"
        displayName: "Install Node.js"

      - script: npm ci
        workingDirectory: client
        displayName: "Install dependencies"

      - script: npx eslint . --format json -o eslint-results.json || true
        workingDirectory: client
        displayName: "Lint (ESLint) - outputs to PR comments"
        continueOnError: true

      - script: node ci-cd/eslint-to-pr-comments.mjs
        displayName: "Post ESLint results as PR comments"
        condition: and(succeededOrFailed(), eq(variables['Build.Reason'], 'PullRequest'))
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)

      - script: npm run format:check
        workingDirectory: client
        displayName: "Format check (Prettier)"

      - script: npm run build
        workingDirectory: client
        displayName: "Build (TypeScript + Vite)"
