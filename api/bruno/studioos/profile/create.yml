info:
  name: create
  type: http
  seq: 2

http:
  method: post
  url: http://127.0.0.1:8000/api/accounts/profile/me/
  headers:
    - name: Authorization
      value: Bearer XXX
  body:
    type: multipart-form
    data:
      - name: photo
        type: file
        value:
          - ./profile/files/profile-photo.png
      - name: display_name
        type: text
        value: Jorge
      - name: bio
        type: text
        value: cozinheiro
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
