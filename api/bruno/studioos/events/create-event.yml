info:
  name: create-event
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/api/events/"
  body:
    type: json
    data: |-
      {
        "title": "Workshop de dança",
        "description": "Descrição curta do evento.",
        "body": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <title>Summer Tech Fest 2026</title>\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <link href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap\" rel=\"stylesheet\">\n  <style>\n    body { margin: 0; font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #0f172a, #1e293b); color: white; }\n    .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }\n    .hero h1 { font-size: 3.5rem; margin-bottom: 10px; background: linear-gradient(90deg, #38bdf8, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }\n    .hero p { font-size: 1.2rem; opacity: 0.8; max-width: 600px; }\n    .cta-btn { margin-top: 25px; padding: 15px 30px; background: linear-gradient(90deg, #6366f1, #a855f7); border: none; border-radius: 30px; font-size: 1rem; color: white; cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease; }\n    .cta-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(168, 85, 247, 0.4); }\n    .section { padding: 60px 20px; text-align: center; }\n    .cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; }\n    .card { background: #1e293b; border-radius: 15px; padding: 20px; width: 280px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); transition: transform 0.2s ease; }\n    .card:hover { transform: translateY(-5px); }\n    .footer { padding: 20px; text-align: center; font-size: 0.9rem; opacity: 0.6; }\n    @media (max-width: 768px) { .hero h1 { font-size: 2.5rem; } }\n  </style>\n</head>\n<body>\n  <div class=\"hero\">\n    <h1>Summer Tech Fest 2026</h1>\n    <p>Join developers, creators, and innovators for a day of inspiration, networking, and cutting-edge tech.</p>\n    <button class=\"cta-btn\">Get Your Ticket</button>\n  </div>\n  <div class=\"section\">\n    <h2>🔥 What to Expect</h2>\n    <div class=\"cards\">\n      <div class=\"card\">\n        <h3>🎤 Talks</h3>\n        <p>Hear from top engineers and founders shaping the future of tech.</p>\n      </div>\n      <div class=\"card\">\n        <h3>🛠 Workshops</h3>\n        <p>Hands-on sessions to level up your skills in AI, Web3, and more.</p>\n      </div>\n      <div class=\"card\">\n        <h3>🤝 Networking</h3>\n        <p>Meet like-minded people, potential co-founders, and recruiters.</p>\n      </div>\n    </div>\n  </div>\n  <div class=\"section\" style=\"background:#0f172a;\">\n    <h2>📅 Event Details</h2>\n    <p><strong>Date:</strong> July 15, 2026</p>\n    <p><strong>Location:</strong> Lisbon Conference Center</p>\n    <p><strong>Time:</strong> 09:00 - 20:00</p>\n  </div>\n  <div class=\"section\">\n    <h2>🚀 Ready to Join?</h2>\n    <button class=\"cta-btn\">Reserve Your Spot</button>\n  </div>\n  <div class=\"footer\">\n    © 2026 Summer Tech Fest · All rights reserved\n  </div>\n</body>\n</html>",
        "location": "Estúdio principal",
        "event_date": "2026-05-15T18:00:00Z",
        "contact_info": "contacto@example.com",
        "notification_target": "all",
        "class_target_classe_ids": []
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
