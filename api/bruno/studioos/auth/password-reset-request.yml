info:
  name: password-reset-request
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/api/accounts/auth/password-reset/"
  body:
    type: json
    data: |-
      {
          "email": "{{password_reset_email}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
