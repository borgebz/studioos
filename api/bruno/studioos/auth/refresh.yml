info:
  name: refresh
  type: http
  seq: 3

http:
  method: post
  url: "{{base_url}}/api/accounts/auth/refresh/"
  body:
    type: json
    data: |-
      {
        "refresh": "{{refresh_token}}"
      }
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
