info:
  name: login
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/accounts/auth/login/"
  body:
    type: json
    data: |-
      {
          "email": "{{login_email}}",
          "password": "{{login_password}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
