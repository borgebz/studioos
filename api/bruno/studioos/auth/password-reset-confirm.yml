info:
  name: password-reset-confirm
  type: http
  seq: 5

http:
  method: POST
  url: "{{base_url}}/api/accounts/auth/password-reset/confirm/"
  body:
    type: json
    data: |-
      {
          "uid": "{{password_reset_uid}}",
          "token": "{{password_reset_token}}",
          "password": "{{password_reset_new_password}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
