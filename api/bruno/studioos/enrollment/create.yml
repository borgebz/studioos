info:
  name: create
  type: http
  seq: 1

http:
  method: post
  url: http://127.0.0.1:8000/api/enrollments/
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "enrollment_type": "new",
        "student_email": "student@example.com",
        "student_name": "student name",
        "student_date_of_birth": "2010-05-15",
        "parent_name": "parent name",
        "parent_email": "parent@example.com",
        "parent_phone": "912345678",
        "parent_phone_country_code": "+351",
        "modality_ids": [
          1
        ],
        "consents": [
          {
            "consent_type": "rgpd",
            "accepted": true
          },
          {
            "consent_type": "internal_regulation",
            "accepted": true
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
