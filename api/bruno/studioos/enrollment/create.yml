info:
  name: create
  type: http
  seq: 1

http:
  method: post
  url: http://127.0.0.1:8000/api/enrollments/
  body:
    type: multipart-form
    data:
      - name: enrollment_type
        type: text
        value: new
      - name: student_email
        type: text
        value: student1@example.com
      - name: student_name
        type: text
        value: student name
      - name: student_date_of_birth
        type: text
        value: 2010-05-15
      - name: parent_name
        type: text
        value: parent name
      - name: parent_email
        type: text
        value: parent@example.com
      - name: parent_phone
        type: text
        value: "912345678"
      - name: parent_phone_country_code
        type: text
        value: "+351"
      - name: modality_ids
        type: text
        value: "1"
      - name: consent_rgpd
        type: text
        value: "true"
      - name: consent_internal_regulation
        type: text
        value: "true"
      - name: payment_proof
        type: file
        value:
          - ./enrollment/files/payment-proof.png
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
