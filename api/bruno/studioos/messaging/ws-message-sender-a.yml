info:
  name: ws-message-sender-a
  type: websocket
  seq: 5
  description: >
    Run any authenticated HTTP request first so the collection pre-request script can log in
    and sync `access_token` from httpOnly cookies when Bruno exposes bru.cookies.get; or set
    `access_token` in the active environment manually. Browsers send cookies on WS upgrade;
    Bruno typically requires ?token= with a JWT.

websocket:
  url: ws://{{base_host}}/ws/conversations/1/?token={{access_token}}
  message:
    type: json
    data: |-
      {
          "body": "Ola Professor!"
      }

settings:
  timeout: 0
  keepAliveInterval: 0
