# =============================================================================
# Staging overrides — run on the VPS only.
#
# Usage on the VPS (with .env file at ./server/.env):
#   GHCR_OWNER=<your-github-user> \
#     docker compose -f docker-compose.yml -f docker-compose.st.yml pull
#   GHCR_OWNER=<your-github-user> \
#     docker compose -f docker-compose.yml -f docker-compose.st.yml up -d
#
# Pulls images from GHCR instead of building. The CI/CD pipeline tags and
# pushes ghcr.io/<owner>/studioos-{api,web}:st-<commit-sha> and :st.
#
# Image tag defaults to "st" (rolling latest staging). Pin to a specific
# build with: IMAGE_TAG=st-a1b2c3d
#
# Note on build vs image precedence: when both are defined (build from base,
# image here), `docker compose up` uses a local image if present, and only
# falls back to building if not. After `pull` brings the image, `up` skips
# the build context entirely.
# =============================================================================

services:

  db:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  api:
    image: ghcr.io/${GHCR_OWNER}/studioos-api:${IMAGE_TAG:-st}
    restart: unless-stopped
    # Run migrate + collectstatic before starting daphne. Idempotent.
    command:
      - sh
      - -c
      - |
        set -e
        uv run python manage.py migrate --noinput
        uv run python manage.py collectstatic --noinput
        exec uv run daphne -b 0.0.0.0 -p 8000 config.asgi:application
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    expose:
      - "8000"

  worker:
    image: ghcr.io/${GHCR_OWNER}/studioos-api:${IMAGE_TAG:-st}
    restart: unless-stopped
    volumes:
      - media_data:/app/media

  beat:
    image: ghcr.io/${GHCR_OWNER}/studioos-api:${IMAGE_TAG:-st}
    restart: unless-stopped

  web:
    image: ghcr.io/${GHCR_OWNER}/studioos-web:${IMAGE_TAG:-st}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"     # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Read-only mounts so Caddy can serve Django static + user media directly
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
    depends_on:
      - api
      - web

volumes:
  media_data:
  static_data:
  caddy_data:
  caddy_config:
