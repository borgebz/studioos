{% extends "emails/base.html" %}

{% block banner %}
  <tr>
    <td style="padding:0;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:{{ banner_bg }};">
        <tr>
          <td class="ea-pad" style="padding:18px 32px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td width="28" style="width:28px; height:28px; background-color:{{ banner_border }}; border-radius:50%; text-align:center; vertical-align:middle; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:16px; font-weight:700; color:#ffffff; line-height:28px; mso-line-height-rule:exactly;">
                  {{ banner_icon }}
                </td>
                <td style="width:12px; line-height:1px; font-size:0;">&nbsp;</td>
                <td style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:14px; font-weight:600; line-height:1.4; color:{{ banner_color }};">
                  {{ banner_text }}
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
{% endblock %}
