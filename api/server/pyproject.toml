[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.2",
    "djangorestframework>=3.16.1",
    "black>=24.0.0",
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pytest-django>=4.9.0",
    "djangorestframework-simplejwt>=5.5.1",
    "python-decouple>=3.8",
    "django-cors-headers>=4.9.0",
    "pillow>=12.1.1",
    "drf-spectacular>=0.29.0",
    "psycopg2-binary>=2.9",
    "celery>=5.6.3",
    "redis>=7.4.0",
    "django-celery-beat>=2.9.0",
    "flower>=2.0.1",
    "openpyxl>=3.1.5",
    "fakeredis>=2.35.1",
    "channels>=4.2.0",
    "channels-redis>=4.2.0",
    "daphne>=4.1.2",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["tests", "inventory", "enrollments"]
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "-ra",
    "-p", "config.pytest_db_env_plugin",
    "--cov",
    "--cov-report=term-missing",
]

[tool.coverage.run]
source = [
    "accounts",
    "billing",
    "classes",
    "coachings",
    "core",
    "enrollments",
    "events",
    "inventory",
    "marketplace",
    "messaging",
    "modality",
    "roles",
    "studios",
]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/tests.py",
    "*/test_*.py",
    "*/*_tests.py",
    "*/admin.py",
    "*/apps.py",
    "*/conftest.py",
    "*/__pycache__/*",
    "config/*",
    "manage.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
]
show_missing = true
precision = 1
skip_empty = true
